# Fish 1.0.3 mounts twelve separately addressable packages.
# Full package names are required by the client scanner.
# Keep stable row ids to preserve existing profile overrides.
- insert:
    - id: approval-guide
      name: '@fish-under-sea/dsh-approval-guide'
    - id: dsh-git-sync
      name: '@fish-under-sea/dsh-git-sync'
    - id: settings-nav-order
      name: '@fish-under-sea/dsh-settings-nav-order'
    - id: agent-teams
      name: '@fish-under-sea/dsh-agent-teams-fish'
      config:
        stateDir: .agent-teams
        memberProvider: spawn
    - id: visual-companion
      name: '@fish-under-sea/dsh-visual-companion'
    - id: skill-lens
      name: '@fish-under-sea/dsh-skill-lens-fish'
    - id: ui-task-board
      name: '@fish-under-sea/dsh-client-ui-task-board-fish'
    - id: ui-git-graph
      name: '@fish-under-sea/dsh-client-ui-git-graph-fish'
    - id: ssh
      name: '@fish-under-sea/dsh-ssh-fish'
    - id: usage
      name: '@fish-under-sea/dsh-usage-fish'
    - id: session-archive
      name: '@fish-under-sea/dsh-session-archive-fish'

# ── 破甲 @fish-under-sea/dsh-purge-fish ──────────────────────────────
# 以下逐字搬运该成员自带的 cordis.patch.yml：行 id、配置键与单装时一致，
# 这样在「装聚合」和「单装破甲」之间切换时，profile 覆盖行不用改。
# 注意：它是本聚合唯一改写宿主内置提示的成员——关闭 harness 身份段、
# 清空 personaPrefix、personaSuffix 换成不插值的固定句，并停用旧的
# 独立红队包行。不想用破甲时，在 profile 里关掉 dsh-purge 行即可。

# 关掉旧的独立红队包行（若用户以前装过 dsh-redteam-mode）
- id: redteam-store
  name: dsh-redteam-store
  disabled: true

- id: redteam-ui
  name: dsh-redteam-ui
  disabled: true

- id: redteam-mode
  name: dsh-redteam-mode
  disabled: true

- id: redteam-mode-store
  name: dsh-redteam-mode/store
  disabled: true

- id: redteam-mode-ui
  name: dsh-redteam-mode/ui
  disabled: true

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
    # [dsh-purge-fix 2026-10-21] {{cwd}} 未注册进 0.2.1-rc.2 的插值变量表 →
    # unknown prompt variable "{{cwd}}"，整轮失败。改成不插值的固定句。
    personaSuffix: Your working directory is the session workspace.

- id: dsh-purge
  inject: [systemPrompt, tools]

- insert:
    - id: dsh-purge
      name: '@fish-under-sea/dsh-purge-fish'
      inject: [systemPrompt, tools]
      config:
        enabled: true
        autoApplyOnStart: false
        autoUpdateOnStart: false
        autoRevertOnMissing: false
        injectOnce: false
        stripMnemon: true
        verbose: false
        postPrompt: ""
        postPromptOrder: 5100
        autoRetry: true
        retryMax: 3
        autoContinue: false
        continueMax: 3
        continueText: "继续"
        capabilityProtocol: true
        hooksDenyBypass: true

    # 演练台：预设 + 技能落地（本插件 lib/redteam）
    - id: dsh-purge-redteam
      name: '@fish-under-sea/dsh-purge-fish/redteam'

    # 演练台事实库（SQLite），数据在 $DSH_HOME/redteam
    - id: dsh-purge-redteam-store
      name: '@fish-under-sea/dsh-purge-fish/redteam/store'
      config:
        root: !!js dshHomePath('redteam')

    # 演练台 HTTP 桥 POST /redteam/api
    - id: dsh-purge-redteam-ui
      name: '@fish-under-sea/dsh-purge-fish/redteam/ui'
