# dsh-fish bundle layer —— Fish 自建插件聚合包的 bundle 入口。
#
# 本文件把三个自建插件的宿主行一次性插入 web profile 的 roster，
# 装一个 dsh-fish 就等于装齐下面三个插件。
#
# ️ 行为什么必须写「裸包名」，不能改写成 `dsh-fish/<子插件>` 这种子路径：
#
# 行的 name 决定两件事，而这两件事对子路径的态度相反：
#
#   1. 宿主半边 —— 子路径也能解析，看起来更漂亮（dsh-web-all 就是这么写的）；
#   2. 浏览器半边 —— DSH 的 client-modules 扫描器用 exactPackageSpecifier()
#      过滤 entries：非 scoped 的包名只要含 "/" 就直接判为「不是包」并跳过
#      （见 @deepseek-ai/dsh-client-modules/lib/index.js 的 locatePkgJson）。
#      于是子路径行读不到任何 package.json，也就读不到 dsh.client 声明，
#      该插件的浏览器半区（设置页 / 审批中文说明 / 同步面板）根本不会注册。
#
# dsh-web-all 之所以能用子路径，是因为它把全部浏览器半区预先打包进了自己
# 唯一的 client bundle（lib/client.js 是一个 __ModuleLoader__.load 大包），
# 由包自身的裸名行承载。本包没有那套打包流程，三个子插件的 client.js 各自
# 独立，所以必须让 loader 按各自的裸包名去认领 —— 这也是本包要求子包被
# 提升到 profile 顶层（link: 或 github:...#path: 显式声明）的原因。
#
# 关于「子包的 cordis.patch.yml 为什么在这里重写一遍」：
# bundle 层只在 `dsh plugin add <包>` 时按包的 `dsh.bundle.patch` 字段
# 展开一层，子包作为传递依赖被装进来时，它们的 patch 不会被自动叠加。
# 所以聚合包必须自己把子包的插行动作复述一遍，否则装了聚合包却一个插件
# 都不生效。
#
# 三个插件的运行期参数都写在 $DSH_HOME 下的各自 config.json 里
# （在 GUI 设置页改），不写在这里，因此不会跟着本包同步到别的机器。

# 会话标题服务每个进程只接受一个提供方，第二次注册直接抛错。
# 所以必须先停用 DSH 内置的「首条消息」提供方（行 id = session-title-llm），
# 让位给本插件的提供方。行为不变：本插件同样以 first-prompt 节奏注册，
# 第 1 轮照样会生成标题。
- id: session-title-llm
  name: '@deepseek-ai/dsh-session-title-first-prompt-llm'
  disabled: true

- insert:
    # 会话标题自动刷新：第 N 轮首次总结命名，此后每 M 轮刷新一次。
    - id: session-title-refresh
      name: dsh-session-title-refresh

    # 审批弹窗中文说明（纯浏览器插件，宿主侧空实现）。
    - id: approval-guide
      name: dsh-approval-guide

    # 一键 GitHub 同步。仓库目录等设置请在「设置 → Git 同步」面板里改，
    # 存在 $DSH_HOME/dsh-git-sync/config.json，不跟着本仓库同步。
    - id: dsh-git-sync
      name: dsh-git-sync