# dsh-session-archive bundle patch: inserts its plugin row into the web plugin roster.
# The bundle is the official dsh plugin shape — install it into a dsh profile
# (`dsh plugin --profile <name> add link:<repo>/packages/dsh-session-archive`). The
# single row mounts BOTH halves: the host side (session inventory, archive/restore,
# physical delete pipeline, auto policy scheduler, dsh-session-archive HTTP routes)
# and the browser side (the modules node half scans dsh.client packages into the web
# plugin roster, served from this package's lib/client.js).
- insert:
    - id: session-archive
      name: '@fish-under-sea/dsh-session-archive-fish'
