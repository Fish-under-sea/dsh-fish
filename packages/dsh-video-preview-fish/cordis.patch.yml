# @fish-under-sea/dsh-video-preview-fish bundle patch (Fish fork)
#
# Inserts the plugin row into the web profile roster. Mounted either directly —
#
#   dsh plugin --profile <name> add @fish-under-sea/dsh-video-preview-fish
#
# — or transitively, as a member of the @fish-under-sea/dsh-fish aggregate
# bundle (which re-states this insert in its own patch layer, because a
# transitive dependency's patch is not expanded automatically).
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the host process and registers the Range-capable `/video` route, while the
# `dsh.client` declaration in package.json loads the browser half
# (exports "./client", served at /plugins/<id>/client.js), which registers the
# inline video viewer with dsh-better-sidebar.
#
# `inject` in client.js is intentionally empty: the browser half only needs the
# `betterSidebar` registry service, which it declares on its own apply. Upstream
# declared `@deepseek-ai/dsh-client-runtime` here, a module DSH removed in
# 0.1.5 — keeping it makes the whole client bundle fail to load.
- insert:
    - id: video-preview
      name: '@fish-under-sea/dsh-video-preview-fish'
